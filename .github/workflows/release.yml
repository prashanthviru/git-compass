name: Release

# Runs when a version tag (v1.2.3) is pushed, normally by `npm run release`.
# Publishes to the VS Code Marketplace and to Open VSX with Trusted Publishing (OIDC,
# no stored tokens), and creates a GitHub Release whose notes are that version's
# section of CHANGELOG.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    # Only v* tags may deploy to this environment, and the Trusted Publishing registrations
    # on both registries only accept tokens from it, so nothing else can publish.
    environment:
      name: release
      url: https://marketplace.visualstudio.com/items?itemName=Prashanthviru.git-compass
    permissions:
      contents: write # create the GitHub Release
      id-token: write # Trusted Publishing (OIDC) for both registries
    env:
      VSIX: git-compass-${{ github.ref_name }}.vsix
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Configure git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: Check tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          node scripts/changelog.js notes "$GITHUB_REF_NAME" > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Run tests
        run: node --test
      - name: Package
        run: npx --yes @vscode/vsce@4.1.0 package -o "$VSIX"
      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath "$VSIX" --skip-duplicate
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$VSIX" --title "Git Compass ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
          fi
      # Cursor, VSCodium, Windsurf and other VS Code forks install from Open VSX. This runs
      # last so a registry problem there never blocks the Marketplace or the GitHub Release.
      # Turn it on with the repository variable OPENVSX_PUBLISH=true once the trusted
      # publisher is registered for Prashanthviru.git-compass on open-vsx.org.
      - name: Publish to Open VSX
        if: vars.OPENVSX_PUBLISH == 'true'
        run: npx --yes ovsx@1.3.0 publish "$VSIX" --trusted-publishing --skip-duplicate
      - name: Open VSX publishing is off
        if: vars.OPENVSX_PUBLISH != 'true'
        run: echo "::warning::Not published to Open VSX. Set the repository variable OPENVSX_PUBLISH=true after registering the trusted publisher on open-vsx.org."
